[project]
name = "toposlicr"
version = "0.0.1"
description = "Automated pipeline from a geographic bounding box to laser-ready, layered topographic map cut boards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "toposlicr" }]
keywords = ["laser", "topography", "dem", "gis", "svg", "glowforge"]

# Phase 0 deliberately keeps runtime deps minimal. Heavier geo/raster stacks
# (rasterio, shapely, geopandas, pyproj, contourpy, vpype, ...) arrive with the
# phases that need them so `uv sync` stays fast while the math core is built.
dependencies = [
    "click>=8.1",
    "contourpy>=1.3.3",
    "fonttools>=4.63.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "rectpack>=0.2.2",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
toposlicr = "toposlicr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toposlicr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # rasterio 1.5 + numpy 2.5: benign internal array-shape deprecation.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    # starlette TestClient httpx deprecation notice — test-only, not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
]
