[project]
name = "toposlicr"
version = "0.0.1"
description = "Automated pipeline from a geographic bounding box to laser-ready, layered topographic map cut boards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "toposlicr" }]
keywords = ["laser", "topography", "dem", "gis", "svg", "glowforge"]

# Phase 0 deliberately keeps runtime deps minimal. Heavier geo/raster stacks
# (rasterio, shapely, geopandas, pyproj, contourpy, vpype, ...) arrive with the
# phases that need them so `uv sync` stays fast while the math core is built.
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
toposlicr = "toposlicr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toposlicr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
